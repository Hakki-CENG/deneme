services:
  haf:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      HAF_API_TOKEN: ${HAF_API_TOKEN:?set HAF_API_TOKEN}
      HAF_SESSION_SECRET: ${HAF_SESSION_SECRET:?set HAF_SESSION_SECRET}
      HAF_COOKIE_SECURE: ${HAF_COOKIE_SECURE:-true}
      HAF_DEFAULT_TENANT: ${HAF_DEFAULT_TENANT:-local}
      HAF_OIDC_ISSUER: ${HAF_OIDC_ISSUER:-}
      HAF_OIDC_CLIENT_ID: ${HAF_OIDC_CLIENT_ID:-}
      HAF_OIDC_CLIENT_SECRET: ${HAF_OIDC_CLIENT_SECRET:-}
      HAF_OIDC_REDIRECT_URI: ${HAF_OIDC_REDIRECT_URI:-}
      HAF_WEBHOOK_TOKEN: ${HAF_WEBHOOK_TOKEN:-}
      HAF_MODEL_PROVIDER: ${HAF_MODEL_PROVIDER:-mock}
      HAF_MODEL_BASE_URL: ${HAF_MODEL_BASE_URL:-https://api.openai.com/v1}
      HAF_MODEL_NAME: ${HAF_MODEL_NAME:-gpt-4.1-mini}
      HAF_MODEL_API_KEY: ${HAF_MODEL_API_KEY:-}
      HAF_MASTER_KEY: ${HAF_MASTER_KEY:?set HAF_MASTER_KEY for restart-stable encrypted secrets}
      HAF_VAULT_ADDRESS: ${HAF_VAULT_ADDRESS:-}
      HAF_VAULT_TOKEN: ${HAF_VAULT_TOKEN:-}
      HAF_VAULT_NAMESPACE: ${HAF_VAULT_NAMESPACE:-}
      HAF_CLOUD_SANDBOX_GATEWAY: ${HAF_CLOUD_SANDBOX_GATEWAY:-}
      HAF_CLOUD_SANDBOX_TOKEN: ${HAF_CLOUD_SANDBOX_TOKEN:-}
      HAF_CLOUD_SANDBOX_NETWORK_POLICY: ${HAF_CLOUD_SANDBOX_NETWORK_POLICY:-none}
      HAF_WASI_TRUSTED_KEYS_JSON: ${HAF_WASI_TRUSTED_KEYS_JSON:-}
      HAF_LEARNING_TRUSTED_KEYS_JSON: ${HAF_LEARNING_TRUSTED_KEYS_JSON:-}
      HAF_HOSTED_SCHEDULER_PORTAL_URL: ${HAF_HOSTED_SCHEDULER_PORTAL_URL:-}
      HAF_HOSTED_SCHEDULER_ACCESS_TOKEN: ${HAF_HOSTED_SCHEDULER_ACCESS_TOKEN:-}
      HAF_HOSTED_SCHEDULER_CALLBACK_URL: ${HAF_HOSTED_SCHEDULER_CALLBACK_URL:-}
      HAF_HOSTED_SCHEDULER_AUDIENCE: ${HAF_HOSTED_SCHEDULER_AUDIENCE:-}
      HAF_HOSTED_SCHEDULER_ISSUER: ${HAF_HOSTED_SCHEDULER_ISSUER:-}
      HAF_HOSTED_SCHEDULER_JWKS_URL: ${HAF_HOSTED_SCHEDULER_JWKS_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_APPLICATION_PUBLIC_KEY: ${DISCORD_APPLICATION_PUBLIC_KEY:-}
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_ALLOWED_USER_IDS: ${SLACK_ALLOWED_USER_IDS:-}
      WHATSAPP_CLOUD_TOKEN: ${WHATSAPP_CLOUD_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-}
      MATRIX_ACCESS_TOKEN: ${MATRIX_ACCESS_TOKEN:-}
      SIGNAL_REST_URL: ${SIGNAL_REST_URL:-}
      SIGNAL_SENDER_NUMBER: ${SIGNAL_SENDER_NUMBER:-}
      SIGNAL_REST_TOKEN: ${SIGNAL_REST_TOKEN:-}
      HAF_OTLP_ENDPOINT: ${HAF_OTLP_ENDPOINT:-}
      HAF_OTLP_HEADERS_JSON: ${HAF_OTLP_HEADERS_JSON:-}
      HAF_BROWSER_CDP_ENDPOINT: ${HAF_BROWSER_CDP_ENDPOINT:-}
      HAF_AUDIO_API_KEY: ${HAF_AUDIO_API_KEY:-}
      HAF_OUTBOUND_WEBHOOK_URL: ${HAF_OUTBOUND_WEBHOOK_URL:-}
      HAF_OUTBOUND_WEBHOOK_SECRET: ${HAF_OUTBOUND_WEBHOOK_SECRET:-}
      # The process runs inside this container, but this is still not per-session isolation.
      HAF_SANDBOX_BACKEND: local
      HAF_AUTO_APPROVE_WORKSPACE: "false"
      HAF_ALLOW_PROCESS: "false"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - haf-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped
volumes:
  haf-data:
