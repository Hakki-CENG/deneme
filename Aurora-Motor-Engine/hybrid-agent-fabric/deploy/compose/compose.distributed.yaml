services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: haf
      POSTGRES_USER: haf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - haf-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haf -d haf"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [haf-internal]
    restart: unless-stopped

  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    volumes:
      - haf-nats:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [haf-internal]
    restart: unless-stopped

  haf:
    environment:
      HAF_POSTGRES_URL: postgresql://haf:${POSTGRES_PASSWORD}@postgres:5432/haf
      HAF_POSTGRES_SCHEMA: haf
      HAF_POSTGRES_NOTIFY: "true"
      HAF_POSTGRES_RLS: ${HAF_POSTGRES_RLS:-true}
      HAF_NATS_SERVERS: nats://nats:4222
      HAF_NATS_PREFIX: haf
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks: [haf-internal]

networks:
  haf-internal:
    driver: bridge

volumes:
  haf-postgres:
  haf-nats:
